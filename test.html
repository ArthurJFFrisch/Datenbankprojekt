<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Aurora Design</title>
    <style>
        :root {
            --bg-color: #b7b7b7;
            --accent-1: #00ff7b; /* Neon Cyan */
            --accent-2: #1064ff; /* Vivid Purple */
            --accent-3: #00c8ff; /* Hot Pink */
            --accent-4: #ff3f3f; /* Hot Pink */
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Der Aurora-Hintergrund-Container */
        .aurora-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(100px); /* Erzeugt den weichen Verlauf */
            opacity: 0.6;
            background: var(--bg-color);
        }

        /* Die animierten Licht-Blobs */
        .blob {
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: move 25s infinite alternate ease-in-out;
        }

        .blob-1 {
            background: var(--accent-1);
            top: -20%;
            left: -10%;
            animation-duration: 10s;
        }

        .blob-2 {
            background: var(--accent-2);
            bottom: -20%;
            right: -10%;
            animation-duration: 15s;
            animation-delay: -5s;
        }

        .blob-3 {
            background: var(--accent-3);
            top: 20%;
            right: 20%;
            width: 50vw;
            height: 50vw;
            animation-duration: 5s;
            animation-delay: -10s;
        }

        .blob-4 {
            background: var(--accent-4);
            top: -20%;
            right: 40%;
            width: 30vw;
            height: 30vw;
            animation-duration: 10s;
            animation-delay: -14s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(10vw, 15vh) scale(1.1) rotate(120deg); }
            66% { transform: translate(-5vw, 20vh) scale(0.9) rotate(240deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        /* Glassmorphism Content Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }

        .cta-button {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Ein subtiles Grid-Overlay für den Tech-Look */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="aurora-wrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
        <div class="blob blob-6"></div>
    </div>

    <div class="grid-overlay"></div>

</body>
</html>
